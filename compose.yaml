services:
  feedbot:
    build: .
    image: kallisti-rss:local
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./config.container.yaml:/config/config.yaml:ro
      - ./secrets/password:/run/secrets/password:ro
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
