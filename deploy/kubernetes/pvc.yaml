apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kallisti-rss-data
spec:
  # ReadWriteOnce works with local-path, hostpath and CSI block storage; the
  # single replica and Recreate strategy keep one writer. On a CSI driver that
  # supports it, ReadWriteOncePod additionally limits the claim to one pod.
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  # Set when the cluster has no default class (for example local-path-retain).
  # storageClassName: your-local-storage-class
  resources:
    requests:
      storage: 1Gi
