apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kallisti-rss
resources:
  - namespace.yaml
  - deployment.yaml
  - pvc.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: kallisti-rss-config
    files:
      - config.yaml
# Build and publish your own image, then replace this with its registry reference.
images:
  - name: kallisti-rss
    newName: kallisti-rss
    newTag: local
