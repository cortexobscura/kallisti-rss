apiVersion: apps/v1
kind: Deployment
metadata:
  name: kallisti-rss
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kallisti-rss
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kallisti-rss
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: feedbot
          image: kallisti-rss:local
          imagePullPolicy: IfNotPresent
          args: ["-config", "/config/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kallisti-rss-config
            defaultMode: 0440
        - name: credentials
          secret:
            secretName: kallisti-rss-credentials
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: data
          persistentVolumeClaim:
            claimName: kallisti-rss-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
