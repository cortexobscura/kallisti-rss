# A fixed project name: the default is the directory name ("docker"), which
# collides with other projects kept in a deploy/docker directory.
name: kallisti-rss
services:
  feedbot:
    build:
      context: ../..
    image: ${KALLISTI_RSS_IMAGE:-kallisti-rss:local}
    # Pin the mounted config so `docker compose run feedbot -status` appends an
    # action instead of replacing the image CMD and its config path.
    entrypoint: ["/feedbot", "-config", "/config/config.yaml"]
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - type: bind
        source: ./config.yaml
        target: /config/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/password
        target: /run/secrets/password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
